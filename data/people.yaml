# ---------------------------------------------------------------- Current
- name: "Bryan Q. Spring, Ph.D."
  group: pi
  status: current
  role: "Associate Professor of Physics · Director of Graduate Studies in Physics · Affiliated Faculty, Bioengineering"
  photo: people/bryan-spring.jpg
  education:
    - "Postdoctoral fellowship, Wellman Center for Photomedicine (MGH / Harvard Medical School), with Tayyaba Hasan"
    - "Ph.D., University of Illinois Urbana–Champaign, with Robert M. Clegg"
    - "Undergraduate research (NSF fellow), University of Rochester, with Robert S. Knox"
  bio: >-
    Bryan Spring runs the lab's program in biomedical physics at Northeastern, which he joined in 2015.
    His path ran from FRET photophysics as an undergraduate, to fluorescence-lifetime and quantitative
    FRET imaging in his doctoral work, to patented methods for imaging and selectively treating cancer
    micrometastases as a postdoc. At Northeastern he has received an NCI K22 Transition Career Development
    Award, a Smith Family Award for Excellence in Biomedical Research, and several NCI grants (including
    within the Physical Sciences–Oncology Network), and he was a 2021 Scialog Fellow in Advancing Bioimaging.
    He co-founded Nira Biosciences (Series A in 2021), whose platform became part of Alys Pharmaceuticals in 2024.
    Away from the lab he meditates, trains calisthenics and runs.
  links:
    profile: "https://cos.northeastern.edu/faculty/bryan-spring/"
    cv: "https://drive.google.com/file/d/1clTszlTchC2SETsSz34-oP3Sy8dgA1tV/view?usp=drive_link"
    linkedin: "https://www.linkedin.com/in/bryan-spring-60925689/"

- name: "Kai Zhang, Ph.D."
  group: postdoc
  status: current
  role: "Postdoctoral Researcher"
  photo: people/kai-zhang.jpg
  education:
    - "Ph.D. Physics, Northeastern University, 2023"
    - "B.S. Physics, University of Minnesota, 2015"
  bio: >-
    Kai first joined as a Physics graduate student in 2017. He builds multiphoton fluorescence
    microendoscopy hardware: an all-normal-dispersion femtosecond fiber laser and a handheld miniature
    probe that pairs a fiber scanner with a micro-objective. He also leads the low-cost LED-array
    photodynamic therapy platform, contributes to the FPGA-based multichannel GHz data-acquisition
    project, and keeps the lab's servers and workstations running.
  links:
    linkedin: "https://www.linkedin.com/in/kai-zhang-9ba0a9155/"

- name: "Liam Price, Ph.D."
  group: postdoc
  status: current
  role: "Postdoctoral Researcher"
  photo: people/liam-price.jpg
  education:
    - "Ph.D. Physics, Northeastern University, 2025"
    - "B.S. Physics, Northeastern University, 2018"
  bio: >-
    Liam has been in the lab since early 2019 and works on optical engineering. He helps design a
    microendoscope aimed at glioblastoma surgery and designs compound prisms for hyperspectral imaging.
    His undergraduate biomedical physics work at Northeastern focused on nanomedicine and clinical optics.
    He likes building computers and listening to music.

- name: "Ji Tae Park"
  group: grad
  status: current
  role: "Ph.D. student, Physics"
  photo: people/ji-tae-park.jpg
  education:
    - "Pharm.D., Northeastern University, 2022"
    - "B.S. Pharmacy Studies, Northeastern University, 2021"
  bio: >-
    Ji Tae started in the lab in 2019 while in Northeastern's six-year Pharm.D. program (with a physics
    minor), then moved into the Physics Ph.D. program. Combining modeling and experiments, he studies how
    antibodies and antibody conjugates such as photoimmunoconjugates behave inside tumors, with the goal of
    quantifying bystander effects, selectivity and avidity, and resistance to targeted therapy. He breakdances
    and follows Chelsea FC.

- name: "Nicholas Otero"
  group: grad
  status: current
  role: "Ph.D. student, Physics"
  photo: people/nicholas-otero.jpg
  education:
    - "B.S. Physics & Forensic Science, Syracuse University, 2021"
  bio: >-
    Nick joined in 2023, in the third year of his Ph.D. He develops 3D microfluidic cell-culture models to
    tune drug dosing for tumor-targeted activatable photoimmunotherapy, and adds silicon photomultipliers to
    the lab's microendoscope for high-speed hyperspectral imaging. As an undergraduate at Syracuse he worked on
    nanopore protein biosensors. He enjoys music, horror films and staying active.

- name: "Ivonne Lozano-Pope"
  group: grad
  status: current
  role: "Ph.D. student, Bioengineering"
  photo: people/ivonne-lozano-pope.png
  education:
    - "M.S. Molecular Biology, Montclair State University, 2013"
    - "B.S. Biology, St. John's University, 2007"
  bio: >-
    Ivonne is a cancer biologist with more than ten years of academic and pharmaceutical research experience.
    Working with patient-derived organoid co-cultures of ovarian and colorectal cancers, she studies
    tumor–immune interactions, chemoresistance, and new treatment strategies, especially pairing
    photodynamic therapy with adoptive T-cell therapy to reshape the tumor microenvironment. Her work uses
    two-photon microscopy and computational image analysis.

- name: "Kristiana Ramos"
  group: grad
  status: current
  role: "Ph.D. student, Physics"
  photo: people/kristiana-ramos.jpg
  education:
    - "B.S. Physics, University of Maryland, College Park, 2023"
  bio: >-
    Kristiana joined in late 2024, in her second Ph.D. year. She investigates how tumor-targeted, activatable
    photodynamic therapy interacts with immunosuppression in the tumor microenvironment, including combining
    photoimmunotherapy with immune checkpoint inhibitors, and she is interested in immune responses to
    nonlinear laser ablation. Her undergraduate research covered nanophotonics, two-photon polymerization and
    FLASH radiotherapy. She makes playlists, reads, and tries new foods.

- name: "Aden Johnson-Shoucair"
  group: grad
  status: current
  role: "Ph.D. student, Bioengineering"
  photo: people/aden-johnson-shoucair.jpg
  education:
    - "M.S. Biotechnology, Northeastern University, 2023"
    - "B.A. Biochemistry, Earlham College, 2020"
  bio: >-
    Aden first worked in the lab as a master's student and came back in 2024. He tests tumor-targeted
    activatable photodynamic therapy in cell culture and in vivo, develops immunodeficient and syngeneic mouse
    models for these studies, and looks at how changing the treatment dose affects whether immune cells are
    spared or stimulated. He bikes, plays clarinet, and enjoys board games.

- name: "Rami Taha"
  group: undergrad
  status: current
  role: "Undergraduate, Bioengineering & Biochemistry (class of 2027)"
  photo: people/rami-taha.jpg
  bio: >-
    Rami is a pre-med student who supports the lab's cell-culture work. Outside the lab he advocates for
    lung-cancer screening, working with ALCSI, members of Congress and MGH to offer free screening to
    high-risk patients.

- name: "Ansa Brew-Smith"
  group: undergrad
  status: current
  role: "Undergraduate, Data Science & Physics (class of 2027)"
  photo: people/ansa-brew-smith.jpg
  bio: >-
    Ansa works with Ji Tae on a mathematical and computational model of drug delivery through cellular
    structures during cancer treatment. He is drawn to theoretical and computational physics, and he
    skateboards and makes music in his free time.

- name: "Jeonghyun \"Jay\" Oh"
  group: undergrad
  status: current
  role: "Undergraduate, Biomedical Physics (class of 2026)"
  photo: people/jay-oh.jpg
  bio: >-
    Jay started volunteering in March 2023, learning cell culture and basic photomedicine experiments. After a
    co-op in the Hasan Lab at MGH/Harvard Medical School, he returned as a full-time co-op in spring 2025. He
    tests how patient-derived high-grade serous ovarian cancer cells respond to chemotherapy and photodynamic
    therapy, and compares photosensitizers under different light doses. He plays soccer and basketball,
    climbs, runs and lifts.

